services:
  - type: web
    name: radar-sampah-species-model
    runtime: python
    branch: iteration3-model-upgrade
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT 'serve:create_app()'
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7

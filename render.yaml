services:
  - type: web
    name: radar-sampah-api
    runtime: python
    rootDir: actual-project/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://radar-sampah-frontend.onrender.com
      # Enter the Render PostgreSQL connection string in the dashboard.
      # It is intentionally not stored in this repository.
      - key: DATABASE_URL
        sync: false
      # Recognition is off by default. Only true plus a private HTTPS URL may
      # call a provider; otherwise the API uses its labelled demo fallback.
      - key: LITTER_RECOGNITION_ENABLED
        value: "false"
      - key: LITTER_RECOGNITION_API_URL
        sync: false
      - key: LITTER_RECOGNITION_API_KEY
        sync: false
      - key: LITTER_RECOGNITION_TIMEOUT_MS
        value: "4000"

  - type: web
    name: radar-sampah-frontend
    runtime: static
    rootDir: actual-project/frontend
    buildCommand: echo "Static site"
    staticPublishPath: .
    plan: free

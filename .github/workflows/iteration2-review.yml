name: Iteration 2 integration review

on:
  push:
    branches:
      - fix/iteration2-backend-review-20260914
      - fix/standalone-cleanup-ai-prod-20260914
  pull_request:
    branches:
      - main
      - iteration-2-dev

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actual-project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: actual-project/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_api.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actual-project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: actual-project/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

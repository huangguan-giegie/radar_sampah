name: Iteration integration review

on:
  push:
    branches:
      - fix/iteration2-backend-review-20260914
      - fix/standalone-cleanup-ai-prod-20260914
      - iteration3
  pull_request:
    branches:
      - main
      - iteration-2-dev
      - iteration3

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actual-project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: actual-project/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_api.py tests/test_active_composition.py tests/test_standalone_cleanup.py tests/test_manual_remarks.py tests/test_litter_gallery.py tests/test_final_band_contract.py tests/test_review_small_legacy.py tests/test_report_updates.py tests/test_yolo_runtime.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actual-project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: actual-project/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build


  production-model-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Measure cold and warm production model latency
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://team04-marine-observation-api.onrender.com"

          echo "=== species distribution ==="
          curl -sS -o /tmp/species-cold.json -w "SPECIES_COLD status=%{http_code} total=%{time_total} ttfb=%{time_starttransfer}\n"             -H "Content-Type: application/json"             -d '{"latitude":2.746,"longitude":101.44}'             "$BASE/api/species-distribution/predict"
          curl -sS -o /tmp/species-warm.json -w "SPECIES_WARM status=%{http_code} total=%{time_total} ttfb=%{time_starttransfer}\n"             -H "Content-Type: application/json"             -d '{"latitude":2.746,"longitude":101.44}'             "$BASE/api/species-distribution/predict"

          AUTH_JSON="$(curl -sS -H "Content-Type: application/json" -d '{}' "$BASE/auth/anonymous")"
          TOKEN="$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["token"])' <<<"$AUTH_JSON")"

          python - <<'PY'
          import base64
          data = base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFElEQVR42mNk+M9Qz0AEYBxVSFIAANMABfT9dN8AAAAASUVORK5CYII=")
          open("/tmp/radar-test.png","wb").write(data)
          PY

          echo "=== litter recognizer ==="
          curl -sS -o /tmp/litter-cold.json -w "LITTER_COLD status=%{http_code} total=%{time_total} ttfb=%{time_starttransfer}\n"             -H "Authorization: Bearer $TOKEN"             -F "photo=@/tmp/radar-test.png;type=image/png"             "$BASE/recognitions/cleanup-photo"
          curl -sS -o /tmp/litter-warm.json -w "LITTER_WARM status=%{http_code} total=%{time_total} ttfb=%{time_starttransfer}\n"             -H "Authorization: Bearer $TOKEN"             -F "photo=@/tmp/radar-test.png;type=image/png"             "$BASE/recognitions/cleanup-photo"

          echo "--- raw litter results ---"\n          cat /tmp/litter-cold.json; echo\n          cat /tmp/litter-warm.json; echo\n          echo "--- result states ---"
          python - <<'PY'
          import json
          for name in ("species-cold","species-warm","litter-cold","litter-warm"):
              with open(f"/tmp/{name}.json","r",encoding="utf-8") as f:
                  body=json.load(f)
              if name.startswith("species"):
                  print(name, "predictions=", len(body.get("predictions", [])))
              else:
                  print(name, "modelState=", body.get("modelState"), "reason=", body.get("reason"))
          PY

name: Export production YOLO model to ONNX

on:
  push:
    branches:
      - fix/onnx-runtime-prod-20260914

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu torchvision==0.29.0+cpu 'ultralytics>=8.3,<9' 'onnx>=1.17' 'onnxslim>=0.1.71'
      - name: Export embedded-NMS ONNX model
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from ultralytics import YOLO

          source = Path('actual-project/ml-model/models/sea_taco_yolo11m_best.pt')
          target = source.with_suffix('.onnx')
          if not source.is_file() or source.stat().st_size < 1_000_000:
              raise SystemExit(f'LFS weights were not materialized: {source} ({source.stat().st_size if source.exists() else 0} bytes)')
          exported = Path(YOLO(str(source)).export(
              format='onnx',
              imgsz=320,
              nms=True,
              simplify=True,
              device='cpu',
              batch=1,
          ))
          if exported.resolve() != target.resolve():
              shutil.copy2(exported, target)
          if not target.is_file() or target.stat().st_size < 1_000_000:
              raise SystemExit(f'ONNX export missing or unexpectedly small: {target}')
          print(f'Exported {target} ({target.stat().st_size} bytes)')
          PY
      - name: Commit ONNX model through Git LFS
        run: |
          git lfs track 'actual-project/ml-model/models/*.onnx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes actual-project/ml-model/models/sea_taco_yolo11m_best.onnx
          if git diff --cached --quiet; then
            echo 'No ONNX artifact changes to commit.'
            exit 0
          fi
          git commit -m 'model: add ONNX runtime artifact'
          git push origin HEAD:${GITHUB_REF_NAME}

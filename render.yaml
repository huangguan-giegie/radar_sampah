services:
  - type: web
    name: team04-marine-observation-api
    runtime: python
    rootDir: actual-project/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://team04-marine-observation-frontend.onrender.com
      # Enter the Render PostgreSQL connection string in the dashboard.
      # It is intentionally not stored in this repository.
      - key: DATABASE_URL
        sync: false
      # Optional HTTPS recognition adapter. When unset, the API returns its
      # deterministic illustrative fallback; no provider key is stored here.
      - key: RECOGNITION_ADAPTER_URL
        sync: false
      - key: SPECIES_RECOGNITION_API_URL
        sync: false
      - key: SPECIES_RECOGNITION_API_KEY
        sync: false
      - key: SPECIES_RECOGNITION_TIMEOUT_MS
        value: "4000"

  - type: web
    name: team04-marine-observation-frontend
    runtime: static
    rootDir: actual-project/frontend
    buildCommand: echo "Static site"
    staticPublishPath: .
    plan: free

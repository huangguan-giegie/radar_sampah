name: ONNX production artifact smoke test

on:
  push:
    branches:
      - fix/onnx-runtime-prod-20260914
    paths:
      - .github/workflows/onnx-runtime-smoke.yml
      - actual-project/backend/recognition.py
      - actual-project/backend/requirements.txt
      - actual-project/ml-model/models/sea_taco_yolo11m_best.onnx

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r actual-project/backend/requirements.txt
      - name: Load and run the real ONNX model
        env:
          PYTHONPATH: actual-project/backend
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import resource
          from PIL import Image
          from recognition import DEFAULT_MODEL_PATH, LitterRecognizer

          assert DEFAULT_MODEL_PATH.suffix == '.onnx'
          assert DEFAULT_MODEL_PATH.is_file(), DEFAULT_MODEL_PATH
          assert DEFAULT_MODEL_PATH.stat().st_size > 70_000_000, DEFAULT_MODEL_PATH.stat().st_size

          recognizer = LitterRecognizer.load()
          assert recognizer.model is not None, recognizer.unavailable_reason
          after_load_kib = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss

          payload = BytesIO()
          Image.new('RGB', (640, 480), 'white').save(payload, format='JPEG')
          result = recognizer.recognise(payload.getvalue())
          assert result['state'] == 'ready', result
          assert set(result['counts']) == {'Fishing gear', 'Plastic', 'Glass', 'Metal', 'Other', 'Paper'}
          after_inference_kib = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          print(f'ONNX smoke ready; peak RSS after load={after_load_kib} KiB, after inference={after_inference_kib} KiB')
          PY

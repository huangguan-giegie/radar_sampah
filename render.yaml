services:
  - type: web
    name: radar-sampah-api
    runtime: python
    rootDir: actual-project/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://radar-sampah-frontend.onrender.com
      # Enter the Render PostgreSQL connection string in the dashboard.
      # It is intentionally not stored in this repository.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      # Configure a private persistent mount/path in production. The application
      # never serves this directory directly; it issues 15-minute signed links.
      - key: PHOTO_STORAGE_DIR
        sync: false

  - type: web
    name: radar-sampah-frontend
    runtime: static
    rootDir: actual-project/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://radar-sampah-api.onrender.com

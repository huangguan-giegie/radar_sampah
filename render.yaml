# One public service serves v2 UI and /api from the same origin.
# Connect an existing PostgreSQL database during Blueprint setup.
services:
  - type: web
    name: radar-sampah-v2
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: GEO_PRIVACY_HMAC_KEY
        generateValue: true

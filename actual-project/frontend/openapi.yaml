openapi: 3.0.3
info:
  title: Radar Sampah API
  version: "2.0.0"
  description: |
    Reviewed Iteration 2 contract after the final Manual Remarks review.

    Key rules:
    - New reports and cleanup actions use quantity bands: Small, Medium, Large, Very Large.
    - New participant-facing writes do not require exact item counts.
    - Small-only new reports are rejected and do not become Counted evidence.
    - GPS duplicate matching is target-aware: within 10 m plus the same active non-Small category/band map is Duplicate; changed content is independent Counted evidence.
    - Raw report/check-in GPS is never returned and new GPS report coordinates are not persisted.
    - Automatic weekly events are created only for Moderate, High, or Severe beaches.
    - Cleanup AI photos are temporary; public gallery media comes only from ordinary Counted report photos.
    - AI output is an editable suggestion, not verification.

servers:
  - url: https://api.example.com
    description: replace with the real host

tags:
  - name: Auth
  - name: Beaches
  - name: Scoring
  - name: Biodiversity
  - name: Geo
  - name: Uploads
  - name: Reports
  - name: Iteration2

security:
  - bearerAuth: []

paths:
  /auth/anonymous:
    post:
      tags: [Auth]
      security: []
      summary: Issue an anonymous participant number
      responses:
        "201":
          description: New anonymous session and recovery token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }

  /auth/restore:
    post:
      tags: [Auth]
      security: []
      summary: Restore an anonymous participant using ID plus recovery token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, token]
              additionalProperties: false
              properties:
                participantId: { type: string, example: "1637" }
                token: { type: string, example: "RS-..." }
      responses:
        "200":
          description: Restored session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      responses:
        "204": { description: Signed out }

  /auth/me:
    get:
      tags: [Auth]
      summary: Read the signed-in participant
      responses:
        "200":
          description: Participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /beaches:
    get:
      tags: [Beaches]
      security: []
      summary: List supported beaches
      responses:
        "200":
          description: Beach summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BeachSummary" }

  /beaches/{beachId}:
    get:
      tags: [Beaches]
      security: []
      summary: Read one beach including current unresolved composition
      parameters:
        - $ref: "#/components/parameters/BeachId"
      responses:
        "200":
          description: Beach detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeachDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /beaches/{beachId}/litter-gallery:
    get:
      tags: [Beaches, Iteration2]
      security: []
      summary: List historical ordinary Counted report photos for one beach
      description: |
        Returns beach-scoped historical gallery entries only. Duplicate reports are excluded.
        A logically resolved historical Counted report may remain in the gallery. No reporter
        identity, raw photo key, exact GPS or proximity reference is returned.
      parameters:
        - $ref: "#/components/parameters/BeachId"
      responses:
        "200":
          description: Gallery entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LitterGalleryEntry" }
        "404": { $ref: "#/components/responses/Error" }

  /beaches/{beachId}/litter-gallery/{reportId}/photo:
    get:
      tags: [Beaches, Iteration2]
      security: []
      summary: Read one short-lived signed gallery photo
      parameters:
        - $ref: "#/components/parameters/BeachId"
        - { name: reportId, in: path, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Report photo bytes }
        "404": { $ref: "#/components/responses/Error" }

  /scoring-method:
    get:
      tags: [Scoring]
      security: []
      summary: Published scoring rule
      responses:
        "200":
          description: Scoring method
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringMethod" }

  /scoring-method/iteration2:
    get:
      tags: [Scoring, Iteration2]
      security: []
      summary: Published Iteration 2 scoring and cleanup semantics
      responses:
        "200":
          description: Iteration 2 scoring method
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/species-distribution/predict:
    post:
      tags: [Biodiversity]
      security: []
      summary: Predict contextual species occurrence from the offline baseline
      description: Relative occurrence context only; never contributes to litter score.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              additionalProperties: false
              properties:
                latitude: { type: number, format: double }
                longitude: { type: number, format: double }
      responses:
        "200":
          description: Relative occurrence predictions
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /geo/resolve-beach:
    post:
      tags: [Geo]
      summary: Resolve request-only coordinates to a supported beach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              additionalProperties: false
              properties:
                lat: { type: number, format: double }
                lng: { type: number, format: double }
      responses:
        "200":
          description: Nearest supported beach or null
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{ $ref: "#/components/schemas/BeachSummary" }]

  /uploads/photos:
    post:
      tags: [Uploads]
      summary: Upload a private report photo after EXIF stripping
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded private photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedPhoto" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /reports:
    post:
      tags: [Reports]
      summary: Submit a quantity-band report
      description: |
        quantities is authoritative for new Iteration 2 writes. A Small-only report is rejected.
        Legacy itemCounts may be accepted only as a backward-compatibility adapter; participant-facing
        new writes must not depend on it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReport" }
      responses:
        "201":
          description: Saved. status may be Counted or Duplicate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LitterReport" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /reports/mine:
    get:
      tags: [Reports]
      summary: List the current participant's reports
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ReportStatus" }
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LitterReport" }

  /reports/mine/counts:
    get:
      tags: [Reports]
      summary: Count reports by status
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCounts" }

  /reports/{reportId}:
    patch:
      tags: [Reports]
      summary: Correct an owned report using the full quantity-band map
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                beachId: { type: string }
                quantities: { $ref: "#/components/schemas/QuantityByCategory" }
                photoKey: { type: string }
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LitterReport" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recognitions:
    post:
      tags: [Iteration2]
      summary: Suggest editable categories and quantity bands from an owned report photo
      description: AI output is a suggestion, not verification. Empty/failed recognition falls back to manual band entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoKey]
              properties:
                photoKey: { type: string }
      responses:
        "200":
          description: Recognition state and editable band suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSuggestion" }
        "401": { $ref: "#/components/responses/Error" }

  /recognitions/cleanup-photo:
    post:
      tags: [Iteration2]
      summary: Suggest cleanup quantity bands from an ephemeral photo
      description: The uploaded cleanup image is processed in memory and discarded; it is not gallery media.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        "200":
          description: Recognition state and editable band suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSuggestion" }

  /cleanup-targets:
    get:
      tags: [Iteration2]
      security: []
      summary: List active Counted reports that can receive linked cleanup
      parameters:
        - { name: beachId, in: query, required: false, schema: { type: string } }
        - { name: reportId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Active cleanup targets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CleanupTarget" }

  /cleanup-actions:
    post:
      tags: [Iteration2]
      summary: Record a linked or standalone band-based cleanup action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/LinkedCleanupInput"
                - $ref: "#/components/schemas/StandaloneCleanupInput"
      responses:
        "201":
          description: Cleanup action recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupAction" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /cleanups/mine:
    get:
      tags: [Iteration2]
      summary: List the current participant's cleanup actions
      responses:
        "200":
          description: Cleanup actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CleanupAction" }

  /events:
    get:
      tags: [Iteration2]
      security: []
      summary: List community cleanup events
      description: |
        Automatic weekly events are created only while the beach is Moderate, High or Severe.
        Low and insufficient-data beaches receive no new automatic events. Existing scheduled
        events are preserved if the Attention state later drops.
      parameters:
        - { name: beachId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CleanupEvent" }
    post:
      tags: [Iteration2]
      summary: Create a moderator event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [beachId, date]
              properties:
                beachId: { type: string }
                date: { type: string, format: date }
      responses:
        "201": { description: Event created }
        "403": { $ref: "#/components/responses/Error" }

  /events/{eventId}:
    get:
      tags: [Iteration2]
      security: []
      summary: Read one event
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /events/{eventId}/join:
    post:
      tags: [Iteration2]
      summary: Join an open event
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200": { description: Joined event }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Iteration2]
      summary: Leave an event
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200": { description: Updated event }

  /events/{eventId}/check-in:
    post:
      tags: [Iteration2]
      summary: Check in using request-only broad-area GPS
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
      responses:
        "200": { description: Check-in accepted }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /events/{eventId}/cleanups:
    get:
      tags: [Iteration2]
      security: []
      summary: Read cleanup actions linked to one event
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event cleanup actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CleanupAction" }

  /share-links:
    get:
      tags: [Iteration2]
      security: []
      summary: Create a signed scope-limited public share link
      parameters:
        - { name: eventId, in: query, required: false, schema: { type: string } }
        - { name: reportId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Share token and frontend path
          content:
            application/json:
              schema:
                type: object
                required: [token, path]
                properties:
                  token: { type: string }
                  path: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /share-links/{token}:
    get:
      tags: [Iteration2]
      security: []
      summary: Read only the event/report authorized by a share token
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Scoped shared data }
        "404": { $ref: "#/components/responses/Error" }

  /share-links/{token}/photo:
    get:
      tags: [Iteration2]
      security: []
      summary: Read the original report photo authorized by a share token
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Scoped report photo }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BeachId:
      name: beachId
      in: path
      required: true
      schema: { type: string }
      example: morib
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string

    User:
      type: object
      required: [id, participantId, role]
      properties:
        id: { type: string }
        participantId: { type: string, example: "1637" }
        role: { type: string, enum: [volunteer, moderator] }

    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        recoveryToken: { type: string, nullable: true }
        user: { $ref: "#/components/schemas/User" }

    SeverityBand:
      type: string
      enum: [Low, Moderate, High, Severe]

    LitterCategory:
      type: string
      enum: [Plastic, Fishing gear, Glass, Metal, Paper, Other]

    QuantityBand:
      type: string
      enum: [Small, Medium, Large, Very Large]

    QuantityByCategory:
      type: object
      minProperties: 1
      additionalProperties: { $ref: "#/components/schemas/QuantityBand" }
      example: { Plastic: Medium, Glass: Large }

    ReportStatus:
      type: string
      enum: [Counted, Duplicate, Incomplete]

    BeachSummary:
      type: object
      required: [id, name, area, lat, lng, severity, band, insufficientData, validReports, attentionScore, eligibleReportCount, lastReportedAt, freshnessKind]
      properties:
        id: { type: string }
        name: { type: string }
        area: { type: string }
        lat: { type: number, format: double, description: Public beach reference coordinate, not a report coordinate }
        lng: { type: number, format: double, description: Public beach reference coordinate, not a report coordinate }
        severity: { allOf: [{ $ref: "#/components/schemas/SeverityBand" }], nullable: true }
        band: { type: integer, minimum: 1, maximum: 4, nullable: true }
        insufficientData: { type: boolean }
        validReports: { type: integer, minimum: 0 }
        attentionScore: { type: number, nullable: true }
        eligibleReportCount: { type: integer, minimum: 0 }
        lastReportedAt: { type: string, format: date-time, nullable: true }
        freshnessKind: { type: string, enum: [ok, aging, stale] }
        habitat: { type: string }
        habitatTag: { type: string }
        sensitivity: { type: string }
        primarySpeciesGlyph: { type: string }
        speciesNames: { type: array, items: { type: string } }
        coverImageUrl: { type: string, nullable: true }
        scene: { type: string }

    CompositionSlice:
      type: object
      required: [category, percentage]
      properties:
        category: { $ref: "#/components/schemas/LitterCategory" }
        percentage: { type: integer, minimum: 0, maximum: 100 }

    CompositionSource:
      type: object
      required: [method, activeReportCount, windowDays]
      properties:
        method: { type: string, enum: [active_report_estimate, yolo, reported_quantity_estimate] }
        activeReportCount: { type: integer, minimum: 0 }
        windowDays: { type: integer, example: 90 }
        createdAt: { type: string, format: date-time, nullable: true }

    BeachDetail:
      allOf:
        - $ref: "#/components/schemas/BeachSummary"
        - type: object
          required: [composition, compositionSource, species, ecologicalNote]
          properties:
            composition:
              type: array
              nullable: true
              items: { $ref: "#/components/schemas/CompositionSlice" }
            compositionSource:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/CompositionSource" }]
            species:
              type: array
              items: { type: object, additionalProperties: true }
            ecologicalNote: { type: string }

    LitterGalleryEntry:
      type: object
      required: [reportId, reportedAt, photoUrl]
      additionalProperties: false
      properties:
        reportId: { type: string }
        reportedAt: { type: string, format: date-time }
        photoUrl: { type: string, description: Short-lived beach/report-scoped gallery URL }

    ScoringMethod:
      type: object
      additionalProperties: true
      properties:
        windowDays: { type: integer, example: 90 }
        minReports: { type: integer, example: 3 }
        reportAggregation: { type: string }
        beachAggregation: { type: string }
        ruleVersion: { type: string }

    UploadedPhoto:
      type: object
      required: [photoKey, previewUrl, metadataStripped]
      properties:
        photoKey: { type: string, description: Private storage key; never a public URL }
        previewUrl: { type: string }
        metadataStripped: { type: boolean }

    CreateReport:
      type: object
      required: [beachId, quantities, photoKey, locationSource]
      additionalProperties: false
      properties:
        beachId: { type: string }
        quantities: { $ref: "#/components/schemas/QuantityByCategory" }
        itemCounts:
          type: object
          deprecated: true
          description: Legacy compatibility adapter only. New participant-facing writes use quantities.
          additionalProperties: { type: integer, minimum: 1 }
        eventId: { type: string, nullable: true }
        photoKey: { type: string }
        locationSource: { type: string, enum: [gps, manual] }
        coords:
          type: object
          nullable: true
          description: Request-only coordinates for GPS matching. New GPS reports do not persist raw lat/lng.
          required: [lat, lng]
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }

    LitterReport:
      type: object
      required: [id, beachId, beachName, quantities, category, quantity, categoryScores, reportScore, createdAt, status]
      properties:
        id: { type: string }
        beachId: { type: string }
        beachName: { type: string }
        quantities: { $ref: "#/components/schemas/QuantityByCategory" }
        itemCounts:
          type: object
          deprecated: true
          description: Historical compatibility data when present; not authoritative for new writes.
          additionalProperties: { type: integer, minimum: 1 }
        eventId: { type: string, nullable: true }
        category: { $ref: "#/components/schemas/LitterCategory" }
        quantity: { $ref: "#/components/schemas/QuantityBand" }
        categoryScores: { type: object, additionalProperties: { type: number } }
        reportScore: { type: number }
        createdAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ReportStatus" }
        statusNote: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true, description: Owner-scoped short-lived URL when authorized }

    AiSuggestion:
      type: object
      required: [modelState, suggestions]
      properties:
        modelState: { type: string, enum: [ready, empty, unavailable] }
        modelVersion: { type: string, nullable: true }
        suggestions:
          type: object
          description: Editable category-to-band suggestions. This is not verification.
          additionalProperties: { $ref: "#/components/schemas/QuantityBand" }

    CleanupTarget:
      type: object
      required: [reportId, beachId, beachName, reportedAt, remainingQuantities]
      properties:
        reportId: { type: string }
        beachId: { type: string }
        beachName: { type: string }
        reportedAt: { type: string, format: date-time }
        remainingQuantities: { $ref: "#/components/schemas/QuantityByCategory" }

    LinkedCleanupInput:
      type: object
      required: [targetReportId, remainingQuantities, handling, idempotencyKey]
      additionalProperties: false
      properties:
        targetReportId: { type: string }
        remainingQuantities:
          type: object
          description: Post-cleanup remaining band state. All-Small/empty resolves the target logically.
          additionalProperties: { $ref: "#/components/schemas/QuantityBand" }
        eventId: { type: string, nullable: true }
        handling: { $ref: "#/components/schemas/CleanupHandling" }
        note: { type: string, maxLength: 500 }
        idempotencyKey: { type: string, maxLength: 128 }

    StandaloneCleanupInput:
      type: object
      required: [beachId, removedQuantities, handling, idempotencyKey]
      additionalProperties: false
      properties:
        beachId: { type: string }
        removedQuantities: { $ref: "#/components/schemas/QuantityByCategory" }
        eventId: { type: string, nullable: true }
        handling: { $ref: "#/components/schemas/CleanupHandling" }
        note: { type: string, maxLength: 500 }
        idempotencyKey: { type: string, maxLength: 128 }

    CleanupHandling:
      type: string
      enum: [Collected for disposal, Recycled / handled, Not recorded]

    CleanupAction:
      type: object
      required: [id, participantId, targetReportId, eventId, beachId, beachName, createdAt, score, handling, status]
      properties:
        id: { type: string }
        participantId: { type: string }
        targetReportId: { type: string, nullable: true }
        eventId: { type: string, nullable: true }
        beachId: { type: string }
        beachName: { type: string }
        createdAt: { type: string, format: date-time }
        remainingQuantities: { type: object, additionalProperties: { $ref: "#/components/schemas/QuantityBand" } }
        removedQuantities: { type: object, additionalProperties: { $ref: "#/components/schemas/QuantityBand" } }
        score: { type: integer, minimum: 0, description: Quantity-band units; not exact items and not personal points }
        resolved: { type: boolean }
        handling: { $ref: "#/components/schemas/CleanupHandling" }
        note: { type: string }
        status: { type: string }

    CleanupEvent:
      type: object
      required: [id, beachId, beachName, area, date, startsAt, endsAt, status, source, participantCount, joinedBy, checkIns, attendanceBy, cleanupIds]
      properties:
        id: { type: string }
        beachId: { type: string }
        beachName: { type: string }
        area: { type: string }
        date: { type: string, format: date }
        startsAt: { type: string, example: "09:00" }
        endsAt: { type: string, example: "12:00" }
        status: { type: string, enum: [Open, Closed] }
        source: { type: string, enum: [weekly, admin] }
        participantCount: { type: integer, minimum: 0 }
        joinedBy: { type: array, items: { type: string } }
        checkIns: { type: object, additionalProperties: { type: string } }
        attendanceBy: { type: array, items: { type: string } }
        cleanupIds: { type: array, items: { type: string } }

    ReportCounts:
      type: object
      required: [counted, duplicate, incomplete]
      properties:
        counted: { type: integer }
        duplicate: { type: integer }
        incomplete: { type: integer }

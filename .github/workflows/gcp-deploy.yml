name: Deploy GCP VM

on:
  push:
    branches:
      - deploy/gcp-e2-micro
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: gcp-radar-sampah
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/199905345342/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions-deploy@project-5db6723a-ac19-4d7c-94a.iam.gserviceaccount.com

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-5db6723a-ac19-4d7c-94a

      - name: Sync source and restart the VM service
        env:
          PROJECT_ID: project-5db6723a-ac19-4d7c-94a
          INSTANCE: radar-sampah
          ZONE: us-west1-b
          REPOSITORY: https://github.com/huangguan-giegie/radar_sampah.git
          BRANCH: deploy/gcp-e2-micro
        run: |
          gcloud compute ssh "$INSTANCE" \
            --project="$PROJECT_ID" \
            --zone="$ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="REPOSITORY='$REPOSITORY' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail

          ROOT=/opt/radar-sampah
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT

          if ! command -v git-lfs >/dev/null 2>&1 || ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs rsync
          fi

          # Do not pull the resident ONNX model into the temporary checkout.
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth=1 --filter=blob:none --branch "$BRANCH" "$REPOSITORY" "$TMP/repo"

          # Keep production secrets and the resident ONNX model on the VM.
          sudo rsync -a --delete \
            --exclude='deploy/gcp/.env' \
            --exclude='actual-project/ml-model/models/' \
            "$TMP/repo/" "$ROOT/"

          MODEL_REL=actual-project/ml-model/models/sea_taco_yolo11m_best.onnx
          MODEL_DEST="$ROOT/$MODEL_REL"
          if [ ! -f "$MODEL_DEST" ]; then
            git -C "$TMP/repo" lfs pull --include="$MODEL_REL"
            sudo install -D -m 0644 "$TMP/repo/$MODEL_REL" "$MODEL_DEST"
          fi

          cd "$ROOT/deploy/gcp"
          sudo bash ./update.sh
          REMOTE

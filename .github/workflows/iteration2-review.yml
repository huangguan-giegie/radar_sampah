name: Iteration integration review

on:
  push:
    branches:
      - fix/iteration2-backend-review-20260914
      - fix/standalone-cleanup-ai-prod-20260914
      - iteration3
      - iteration3-species-upgrade
  pull_request:
    branches:
      - main
      - iteration-2-dev
      - iteration3

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actual-project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: actual-project/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Check offline species retraining
        run: python ../species-training/train.py --species "Amphiprion ocellaris" --workers 1 --output-dir ../species-training/runs/ci-smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actual-project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: actual-project/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

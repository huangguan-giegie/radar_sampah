openapi: 3.0.3
info:
  title: Radar Sampah API
  version: "1.0.0"
  description: |
    The Iteration 1 (Core MVP) backend.

    This is one of three copies of the same contract — change one, change all three:
      openapi.yaml (this file, English)  for tooling
      API.en.md    (English)             for LiHanXia and Keith, with the reasoning
      API.md       (Chinese)             for Qian Jiang

    NOTE: the backend currently in the repo (backend/app.py, /api/*) does NOT implement this.
    This document is the target. Leave VITE_API_BASE_URL empty until it exists.

    The points that get missed:
    - Under 3 eligible reports, severity and band MUST be null — never fall back to Low
    - A duplicate returns 201 with status=Duplicate. It is a result, not an error
    - Coordinates are used only to match a beach. No response may ever return them
    - EXIF location data must actually be stripped from every photo
    - /scoring-method is optional (US4.3 ships from the frontend), but §7's calculation must
      use the same numbers
    - Auth is an anonymous participant number: no name, no email, no password

servers:
  - url: https://api.example.com
    description: replace with the real host

tags:
  - name: Auth
  - name: Beaches
  - name: Scoring
  - name: Geo
  - name: Uploads
  - name: Reports

security:
  - bearerAuth: []

paths:
  /auth/anonymous:
    post:
      tags: [Auth]
      security: []
      summary: Issue an anonymous participant number
      description: No name, email or password is collected. Returns a random 4-digit number.
      responses:
        "201":
          description: the new participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }

  /auth/restore:
    post:
      tags: [Auth]
      security: []
      summary: Continue on another device with an existing number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId]
              properties:
                participantId: { type: string, example: "1637" }
      responses:
        "200":
          description: session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "404":
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      responses:
        "204": { description: signed out }

  /auth/me:
    get:
      tags: [Auth]
      summary: The signed-in participant
      responses:
        "200":
          description: participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Error"

  /beaches:
    get:
      tags: [Beaches]
      security: []
      summary: Every beach, for the map and the home list
      responses:
        "200":
          description: all supported beaches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BeachSummary" }

  /beaches/{beachId}:
    get:
      tags: [Beaches]
      security: []
      summary: One beach in detail
      parameters:
        - { name: beachId, in: path, required: true, schema: { type: string }, example: morib }
      responses:
        "200":
          description: detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeachDetail" }
        "404":
          $ref: "#/components/responses/Error"

  /scoring-method:
    get:
      tags: [Scoring]
      security: []
      summary: "[Optional] The published scoring rule — weights, thresholds, window"
      description: |
        US4.3 is a non-blocking stretch and the rule ships from the frontend
        (src/scoring.ts), so leaving this endpoint unimplemented breaks nothing.

        But severity MUST be computed with the weights and thresholds in §3. A published rule
        that differs from the one actually applied defeats the point of US4.3. If this endpoint
        is implemented and disagrees with the frontend, the backend wins and the frontend warns
        in development.
      responses:
        "200":
          description: the rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringMethod" }

  /geo/resolve-beach:
    post:
      tags: [Geo]
      summary: Resolve one set of coordinates to a beach (the coordinates are not stored here)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: double, example: 2.7461 }
                lng: { type: number, format: double, example: 101.4402 }
      responses:
        "200":
          description: the beach, or null when no supported beach lies within 25 km
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BeachSummary" }
                  - { type: "null" }

  /uploads/photos:
    post:
      tags: [Uploads]
      summary: Upload a photo (the server must strip its EXIF location data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: JPEG / PNG / HEIC，≤ 10 MB
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedPhoto" }
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"


  /reports:
    post:
      tags: [Reports]
      summary: Submit a report (its status is decided inside this request)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReport" }
      responses:
        "201":
          description: |
            Saved. Note that status may be Duplicate — that is a normal outcome, not an error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LitterReport" }
        "400":
          $ref: "#/components/responses/Error"

  /reports/mine:
    get:
      tags: [Reports]
      summary: My reports, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ReportStatus" }
      responses:
        "200":
          description: the list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LitterReport" }

  /reports/mine/counts:
    get:
      tags: [Reports]
      summary: Counts for the three statuses
      responses:
        "200":
          description: counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCounts" }

  /reports/{reportId}:
    patch:
      tags: [Reports]
      summary: Correct a report (re-run the status rules afterwards)
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                beachId: { type: string }
                quantities:
                  type: object
                  minProperties: 1
                  description: |
                    Replaces the whole set; it is not a per-key merge. A category left out is
                    a column cleared, so a correction must first read the response's quantities
                    back into the form and send the complete set.
                  additionalProperties: { $ref: "#/components/schemas/QuantityBand" }
                photoUrl: { type: string, format: uri }
      responses:
        "200":
          description: the updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LitterReport" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: machine-readable error code
          enum:
            - VALIDATION_FAILED
            - PHOTO_REQUIRED
            - PHOTO_TOO_LARGE
            - PHOTO_UNSUPPORTED_TYPE
            - UNAUTHENTICATED
            - NOT_OWNER
            - NOT_FOUND
            - UNKNOWN_PARTICIPANT
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - INTERNAL_ERROR
        message:
          type: string
          description: a full English sentence shown to the user verbatim

    User:
      type: object
      required: [id, participantId, role]
      properties:
        id: { type: string, example: u_01H8XK }
        participantId:
          type: string
          example: "1637"
          description: the 4-digit anonymous number — random, never sequential, unique
        role: { type: string, enum: [volunteer, moderator] }

    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: "JWT, valid for 30 days" }
        user: { $ref: "#/components/schemas/User" }

    SeverityBand:
      type: string
      enum: [Low, Moderate, High, Severe]

    LitterCategory:
      type: string
      enum: [Plastic, Fishing gear, Glass, Metal, Paper, Other]

    QuantityBand:
      type: string
      enum: [Small, Medium, Large, Very Large]

    ReportStatus:
      type: string
      enum: [Counted, Duplicate, Incomplete]

    SpeciesGlyph:
      type: string
      enum: [turtle, bird, mangrove, grass, crab, fish]

    BeachSummary:
      type: object
      required:
        [id, name, area, lat, lng, severity, band, insufficientData, validReports,
         lastReportedAt, freshnessKind, habitat, habitatTag, sensitivity,
         primarySpeciesGlyph, coverImageUrl, scene]
      properties:
        id: { type: string, example: morib }
        name: { type: string, example: Pantai Morib }
        area: { type: string, example: "Banting, Selangor" }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        severity:
          allOf: [{ $ref: "#/components/schemas/SeverityBand" }]
          nullable: true
          description: must be null when there are fewer than 3 eligible reports
        band:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4
          description: matches severity one for one, and is null whenever severity is
        insufficientData: { type: boolean }
        validReports:
          type: integer
          description: counts Counted reports only
        lastReportedAt:
          type: string
          format: date-time
          nullable: true
          description: the newest Counted report's time, ignoring the 90-day window
        freshnessKind:
          type: string
          enum: [ok, aging, stale]
          description: "under 30 days / 30-90 days / over 90 days or never reported"
        habitat: { type: string, example: "Intertidal mudflat & sandy shore" }
        habitatTag: { type: string, example: MUDFLAT }
        sensitivity: { type: string, example: Migratory feeding ground }
        primarySpeciesGlyph: { $ref: "#/components/schemas/SpeciesGlyph" }
        coverImageUrl:
          type: string
          format: uri
          nullable: true
          description: null when there is no photo — the app falls back to the scene gradient
        scene:
          type: string
          description: a CSS background used when there is no photo; already in the seed data

    Species:
      type: object
      required: [name, kind, scientificName, threatCategory, glyph, text, source]
      properties:
        name: { type: string, example: Green Sea Turtle }
        kind:
          type: string
          enum: [species, habitat, group]
          description: only kind=species can carry a scientific name or a threat category
        scientificName:
          type: string
          nullable: true
          example: Chelonia mydas
        threatCategory:
          type: string
          nullable: true
          description: IUCN category. null when it could not be sourced — do not guess
          example: Endangered
        glyph: { $ref: "#/components/schemas/SpeciesGlyph" }
        pictureUrl: { type: string, format: uri, nullable: true }
        text: { type: string }
        source: { $ref: "#/components/schemas/SpeciesSource" }
        likelihood:
          nullable: true
          description: |
            Epic 5's modelled occurrence likelihood. Omit it or send null and the card renders
            as pure reference content. It must NEVER be folded into the litter severity score;
            the app styles it separately and labels it MODELLED · ESTIMATE.
          allOf: [{ $ref: "#/components/schemas/SpeciesLikelihood" }]

    SpeciesSource:
      type: object
      required: [dataset, citation]
      description: |
        Provenance is part of the data, not a footnote. FishBase and OBIS are both CC BY-NC:
        the citation has to be displayed, and the source URL and access date preserved.
      properties:
        dataset:
          type: string
          enum: [FishBase, OBIS, other, pending]
          description: on 'pending' the app prints an amber SOURCE PENDING badge
        citation: { type: string }
        url: { type: string, format: uri, nullable: true }
        accessedAt: { type: string, format: date, nullable: true }

    SpeciesLikelihood:
      type: object
      required: [percent, basis]
      properties:
        percent: { type: integer, minimum: 0, maximum: 100, example: 38 }
        basis:
          type: string
          example: Habitat match + 2024 sighting records
          description: what the number is based on. It is shown on screen and cannot be empty

    CompositionSlice:
      type: object
      required: [category, quantity]
      properties:
        category: { $ref: "#/components/schemas/LitterCategory" }
        quantity: { $ref: "#/components/schemas/QuantityBand" }

    CompositionSource:
      type: object
      required: [reportId, createdAt]
      description: which report the composition came from. Required whenever composition is non-null
      properties:
        reportId: { type: string }
        createdAt: { type: string, format: date-time }

    BeachDetail:
      allOf:
        - $ref: "#/components/schemas/BeachSummary"
        - type: object
          required: [composition, compositionSource, species, ecologicalNote]
          properties:
            composition:
              type: array
              nullable: true
              description: |
                The non-null categories of that beach's newest Counted report, ordered by
                category weight. Not an aggregate, and unrelated to insufficientData.
                Null when the beach has no Counted report at all.
              items: { $ref: "#/components/schemas/CompositionSlice" }
            compositionSource:
              nullable: true
              description: null exactly when composition is null
              allOf: [{ $ref: "#/components/schemas/CompositionSource" }]
            species:
              type: array
              maxItems: 5
              items: { $ref: "#/components/schemas/Species" }
            ecologicalNote: { type: string }

    ScoringMethod:
      type: object
      required: [categoryWeights, quantityWeights, bands, windowDays, minReports]
      properties:
        categoryWeights:
          type: array
          items:
            type: object
            required: [category, weight]
            properties:
              category: { $ref: "#/components/schemas/LitterCategory" }
              weight: { type: number, format: float }
        quantityWeights:
          type: array
          items:
            type: object
            required: [quantity, weight]
            properties:
              quantity: { $ref: "#/components/schemas/QuantityBand" }
              weight: { type: number, format: float }
        bands:
          type: array
          items:
            type: object
            required: [band, range, color]
            properties:
              band: { $ref: "#/components/schemas/SeverityBand" }
              range: { type: string, example: "1.5 – 2.4" }
              color: { type: string, example: "#D9A24B" }
        windowDays: { type: integer, example: 90 }
        minReports: { type: integer, example: 3 }

    UploadedPhoto:
      type: object
      required: [url, metadataStripped]
      properties:
        url:
          type: string
          format: uri
          description: the address in object storage, publicly readable; no bytes in the database
        metadataStripped:
          type: boolean
          description: true only once the EXIF location data is really gone

    CreateReport:
      type: object
      required: [beachId, quantities, photoUrl, locationSource]
      properties:
        beachId: { type: string, example: morib }
        quantities:
          type: object
          minProperties: 1
          description: |
            One band per category. Keys are the category strings verbatim, values are one of
            the four bands. At least one entry; a category that was not seen is simply absent —
            do not send null and do not send 0. The backend maps this onto the six qty_* columns
            and derives category / quantity from it.
          additionalProperties: { $ref: "#/components/schemas/QuantityBand" }
          example: { Plastic: Large, "Fishing gear": Medium }
        photoUrl: { type: string, format: uri }
        locationSource:
          type: string
          enum: [gps, manual]
        coords:
          type: object
          nullable: true
          description: |
            Sent only when locationSource=gps. Stored on the report's own lat/lng columns,
            already rounded to 3 decimals (~110 m), and used only to match a beach.
            Never returned in any response — exclude both columns explicitly in the
            serialiser rather than relying on remembering; a SELECT * will carry them out.
          required: [lat, lng]
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }

    LitterReport:
      type: object
      required: [id, beachId, beachName, quantities, category, quantity, createdAt, status]
      properties:
        id: { type: string }
        beachId: { type: string }
        beachName: { type: string }
        quantities:
          type: object
          minProperties: 1
          description: |
            Which categories this report actually recorded. The full map must be returned:
            the correction flow reads it back into the form and PATCHes the whole set, so
            sending only the derived pair below would clear every other category.
          additionalProperties: { $ref: "#/components/schemas/QuantityBand" }
        category:
          description: derived — the highest-weighted category present in quantities
          allOf: [{ $ref: "#/components/schemas/LitterCategory" }]
        quantity:
          description: derived — that category's band
          allOf: [{ $ref: "#/components/schemas/QuantityBand" }]
        createdAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ReportStatus" }
        statusNote:
          type: string
          nullable: true
          description: why it was excluded, a full English sentence shown verbatim; absent for Counted
        photoUrl: { type: string, format: uri, nullable: true }

    ReportCounts:
      type: object
      required: [counted, duplicate, incomplete]
      properties:
        counted: { type: integer }
        duplicate: { type: integer }
        incomplete: { type: integer }

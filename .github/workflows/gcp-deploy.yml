name: Deploy GCP VM

on:
  push:
    branches:
      - deploy/gcp-e2-micro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcp-radar-sampah
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-5db6723a-ac19-4d7c-94a

      - name: Sync source and restart the VM service
        env:
          PROJECT_ID: project-5db6723a-ac19-4d7c-94a
          INSTANCE: radar-sampah
          ZONE: us-west1-b
          REPOSITORY: https://github.com/huangguan-giegie/radar_sampah.git
          BRANCH: deploy/gcp-e2-micro
        run: |
          gcloud compute ssh "$INSTANCE" \
            --project="$PROJECT_ID" \
            --zone="$ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="REPOSITORY='$REPOSITORY' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail

          ROOT=/opt/radar-sampah
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT

          if ! command -v git-lfs >/dev/null 2>&1 || ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs rsync
          fi

          git clone --depth=1 --branch "$BRANCH" "$REPOSITORY" "$TMP/repo"

          # Keep production secrets and the resident ONNX model on the VM.
          sudo rsync -a --delete \
            --exclude='deploy/gcp/.env' \
            --exclude='actual-project/backend/models/' \
            "$TMP/repo/" "$ROOT/"

          cd "$ROOT/deploy/gcp"
          sudo ./update.sh
          REMOTE

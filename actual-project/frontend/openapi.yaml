openapi: 3.0.3
info:
  title: Radar Sampah API
  version: "1.0.0"
  description: |
    The current main contract with additive Iteration 2 cleanup and community-event operations.

    This is one of three copies of the same contract — change one, change all three:
    openapi.yaml (this file, English)  for tooling
      API.en.md    (English)             for LiHanXia and Keith, with the reasoning
      API.md       (Chinese)             for Qian Jiang

    backend/app.py implements this contract. Iteration 2 details and privacy rules are also
    documented in backend/API_ITERATION2.md.

    The points that get missed:
    - Under 3 active reports, severity and band MUST be null — never fall back to Low
    - A duplicate returns 201 with status=Duplicate. It is a result, not an error
    - Duplicate means either an exact same-participant/day/signature match, or a same-beach/day GPS match within about 10 m; the GPS rule applies across participants
    - Coordinates are used only to match a beach. No response may ever return them
    - EXIF location data must actually be stripped from every photo
    - /scoring-method is optional (US4.3 ships from the frontend), but §7's calculation must
      use the same numbers
    - Auth is an anonymous participant number: no name, no email, no password

servers:
  - url: https://api.example.com
    description: replace with the real host

tags:
  - name: Auth
  - name: Beaches
  - name: Scoring
  - name: Biodiversity
  - name: Geo
  - name: Uploads
  - name: Reports
  - name: Iteration2

security:
  - bearerAuth: []

paths:
  /auth/anonymous:
    post:
      tags: [Auth]
      security: []
      summary: Issue an anonymous participant number
      description: No personal details are collected. Returns a random 4-digit ID and a recovery token shown once.
      responses:
        "201":
          description: the new participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }

  /auth/restore:
    post:
      tags: [Auth]
      security: []
      summary: Continue on another device with an existing number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, token]
              properties:
                participantId: { type: string, example: "1637" }
                token: { type: string, description: "System-generated recovery token; required together with participantId" }
      responses:
        "200":
          description: session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      responses:
        "204": { description: signed out }

  /auth/me:
    get:
      tags: [Auth]
      summary: The signed-in participant
      responses:
        "200":
          description: participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Error"

  /beaches:
    get:
      tags: [Beaches]
      security: []
      summary: Every beach, for the map and the home list
      responses:
        "200":
          description: all supported beaches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BeachSummary" }

  /beaches/{beachId}:
    get:
      tags: [Beaches]
      security: []
      summary: One beach in detail
      parameters:
        - { name: beachId, in: path, required: true, schema: { type: string }, example: morib }
      responses:
        "200":
          description: detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeachDetail" }
        "404":
          $ref: "#/components/responses/Error"

  /scoring-method:
    get:
      tags: [Scoring]
      security: []
      summary: "[Optional] The published scoring rule — weights, thresholds, window"
      description: |
        US4.3 is a non-blocking stretch and the rule ships from the frontend
        (src/scoring.ts), so leaving this endpoint unimplemented breaks nothing.

        But severity MUST be computed with the weights and thresholds in §3. A published rule
        that differs from the one actually applied defeats the point of US4.3. If this endpoint
        is implemented and disagrees with the frontend, the backend wins and the frontend warns
        in development.
      responses:
        "200":
          description: the rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringMethod" }

  /api/species-distribution/predict:
    post:
      tags: [Biodiversity]
      security: []
      summary: Predict contextual species occurrence from the offline baseline
      description: |
        Uses four models trained from a packaged OBIS snapshot. It is not a real-time OBIS query,
        does not store coordinates or predictions, and the relative scores do not contribute to
        litter severity. Coordinates must be inside the supported Malaysian EEZ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              additionalProperties: false
              properties:
                latitude: { type: number, format: double, example: 2.746 }
                longitude: { type: number, format: double, example: 101.44 }
      responses:
        "200":
          description: four relative occurrence predictions
          content:
            application/json:
              schema:
                type: object
                required: [insideMalaysianEez, scoreType, calibratedProbability, predictions, modelVersion]
                properties:
                  insideMalaysianEez: { type: boolean, example: true }
                  scoreType: { type: string, enum: [relative_occurrence] }
                  calibratedProbability: { type: boolean, example: false }
                  modelVersion: { type: string, example: "2026-08-29" }
                  predictions:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items:
                      type: object
                      required: [speciesSlug, scientificName, commonNameEn, relativeOccurrenceScore, selectedModel]
                      properties:
                        speciesSlug: { type: string }
                        scientificName: { type: string }
                        commonNameEn: { type: string }
                        relativeOccurrenceScore: { type: number, minimum: 0, maximum: 1 }
                        selectedModel: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /geo/resolve-beach:
    post:
      tags: [Geo]
      summary: Resolve one set of coordinates to a beach (the coordinates are not stored here)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: double, example: 2.7461 }
                lng: { type: number, format: double, example: 101.4402 }
      responses:
        "200":
          description: the beach, or null when no supported beach lies within 25 km
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BeachSummary" }
                  - { type: "null" }

  /uploads/photos:
    post:
      tags: [Uploads]
      summary: Upload a photo (the server must strip its EXIF location data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: JPEG / PNG / HEIC，≤ 10 MB
      responses:
        "201":
          description: uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedPhoto" }
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"


  /reports:
    post:
      tags: [Reports]
      summary: Submit a report (its status is decided inside this request)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReport" }
      responses:
        "201":
          description: |
            Saved. status may be Duplicate either from the exact signature rule or from a same-beach, same-Malaysia-day privacy-preserving GPS match within about 10 m. The GPS rule applies across participants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LitterReport" }
        "400":
          $ref: "#/components/responses/Error"

  /reports/mine:
    get:
      tags: [Reports]
      summary: My reports, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ReportStatus" }
      responses:
        "200":
          description: the list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LitterReport" }

  /reports/mine/counts:
    get:
      tags: [Reports]
      summary: Counts for the three statuses
      responses:
        "200":
          description: counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCounts" }

  /reports/{reportId}:
    patch:
      tags: [Reports]
      summary: Correct a report (re-run the status rules afterwards)
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                beachId: { type: string }
                quantities:
                  type: object
                  minProperties: 1
                  description: |
                    Replaces the whole set; it is not a per-key merge. A category left out is
                    a column cleared, so a correction must first read the response's quantities
                    back into the form and send the complete set.
                  additionalProperties: { $ref: "#/components/schemas/QuantityBand" }
                photoKey: { type: string, description: 上传接口返回的存储键 }
      responses:
        "200":
          description: the updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LitterReport" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /recognitions:
    post:
      tags: [Iteration2]
      summary: Recognise litter in an owned report photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoKey]
              properties:
                photoKey: { type: string }
      responses:
        "200":
          description: detected counts and compatible quantity bands
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }

  /recognitions/cleanup-photo:
    post:
      tags: [Iteration2]
      summary: Recognise a cleanup photo in memory, then discard it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        "200": { description: detected counts and compatible quantity bands }

  /cleanup-targets:
    get:
      tags: [Iteration2]
      security: []
      summary: List counted reports with remaining confirmed item counts
      parameters:
        - { name: beachId, in: query, required: false, schema: { type: string } }
        - { name: reportId, in: query, required: false, schema: { type: string }, description: Limit results to one selected cleanup target }
      responses:
        "200":
          description: remaining cleanup targets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CleanupTarget" }

  /cleanup-actions:
    post:
      tags: [Iteration2]
      summary: Append a partial cleanup action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetReportId, removed, handling]
              properties:
                targetReportId: { type: string }
                eventId: { type: string, nullable: true }
                removed: { type: object, additionalProperties: { type: integer, minimum: 1 } }
                handling: { type: string, enum: [Collected for disposal, Recycled / handled, Not recorded] }
                note: { type: string, maxLength: 500 }
                idempotencyKey: { type: string, maxLength: 128 }
      responses:
        "201":
          description: cleanup action recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupAction" }
        "409": { $ref: "#/components/responses/Error" }

  /cleanups/mine:
    get:
      tags: [Iteration2]
      summary: List the current participant's cleanup actions
      responses:
        "200":
          description: current participant's actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CleanupAction" }

  /events:
    get:
      tags: [Iteration2]
      security: []
      summary: List scheduled and moderator-created events
      parameters:
        - { name: beachId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CleanupEvent" }
    post:
      tags: [Iteration2]
      summary: Create a community event (moderator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [beachId, date]
              properties:
                beachId: { type: string }
                date: { type: string, format: date }
      responses:
        "201": { description: event created }
        "403": { $ref: "#/components/responses/Error" }

  /events/{eventId}:
    get:
      tags: [Iteration2]
      security: []
      summary: Read an event
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /share-links:
    get:
      tags: [Iteration2]
      security: []
      summary: Create a stable, scope-limited public share link
      description: Event links can be created publicly. A report link requires the authenticated report owner.
      parameters:
        - { name: eventId, in: query, required: false, schema: { type: string } }
        - { name: reportId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Signed share token and frontend path
          content:
            application/json:
              schema:
                type: object
                required: [token, path]
                properties:
                  token: { type: string }
                  path: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /share-links/{token}:
    get:
      tags: [Iteration2]
      security: []
      summary: Read only the event and report authorized by a share token
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Scoped shared event and optional report }
        "404": { $ref: "#/components/responses/Error" }

  /share-links/{token}/photo:
    get:
      tags: [Iteration2]
      security: []
      summary: Read the original photo for the report in a share token
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Scoped report photo }
        "404": { $ref: "#/components/responses/Error" }

  /events/{eventId}/cleanups:
    get:
      tags: [Iteration2]
      security: []
      summary: Read the cleanup actions linked to an event
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: event cleanup actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CleanupAction" }

  /events/{eventId}/join:
    post:
      tags: [Iteration2]
      summary: Join an open event
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: joined event }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Iteration2]
      summary: Leave an event
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: updated event }

  /events/{eventId}/check-in:
    post:
      tags: [Iteration2]
      summary: Check in using request-only GPS coordinates
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
      responses:
        "200": { description: checked-in event }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: machine-readable error code
          enum:
            - VALIDATION_FAILED
            - PHOTO_REQUIRED
            - PHOTO_TOO_LARGE
            - PHOTO_UNSUPPORTED_TYPE
            - UNAUTHENTICATED
            - NOT_OWNER
            - NOT_FOUND
            - UNKNOWN_PARTICIPANT
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - INVALID_RECOVERY_TOKEN
            - MODERATOR_REQUIRED
            - LOCATION_OUT_OF_RANGE
            - ACTIVE_CLEANUP_TARGET_NEARBY
            - REMOVED_COUNT_EXCEEDS_REMAINING
            - CLEANUP_TARGET_COMPLETE
            - IDEMPOTENCY_CONFLICT
            - JOIN_REQUIRED
            - EVENT_CHECKIN_REQUIRED
            - EVENT_NOT_ACTIVE
            - EVENT_CLOSED
            - INTERNAL_ERROR
        message:
          type: string
          description: a full English sentence shown to the user verbatim

    User:
      type: object
      required: [id, participantId, role]
      properties:
        id: { type: string, example: u_01H8XK }
        participantId:
          type: string
          example: "1637"
          description: the 4-digit anonymous number — random, never sequential, unique
        role: { type: string, enum: [volunteer, moderator] }

    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: "JWT, valid for 30 days" }
        recoveryToken: { type: string, description: "Optional extension; returned once when supported by the backend" }
        user: { $ref: "#/components/schemas/User" }

    SeverityBand:
      type: string
      enum: [Low, Moderate, High, Severe]

    LitterCategory:
      type: string
      enum: [Plastic, Fishing gear, Glass, Metal, Paper, Other]

    QuantityBand:
      type: string
      enum: [Small, Medium, Large, Very Large]

    ReportStatus:
      type: string
      enum: [Counted, Duplicate, Incomplete]

    SpeciesGlyph:
      type: string
      enum: [turtle, bird, mangrove, grass, crab, fish]

    BeachSummary:
      type: object
      required:
        [id, name, area, lat, lng, severity, band, insufficientData, validReports,
         attentionScore, eligibleReportCount,
         lastReportedAt, freshnessKind, habitat, habitatTag, sensitivity,
         primarySpeciesGlyph, speciesNames, coverImageUrl, scene]
      properties:
        id: { type: string, example: morib }
        name: { type: string, example: Pantai Morib }
        area: { type: string, example: "Banting, Selangor" }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        severity:
          allOf: [{ $ref: "#/components/schemas/SeverityBand" }]
          nullable: true
          description: must be null when there are fewer than 3 eligible reports
        band:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4
          description: matches severity one for one, and is null whenever severity is
        insufficientData: { type: boolean }
        validReports:
          type: integer
          description: counts Counted reports only
        attentionScore:
          type: number
          format: float
          nullable: true
          description: median active report score after cleanup over the latest 90 days; null when fewer than three active reports qualify
        eligibleReportCount:
          type: integer
          minimum: 0
          description: Counted, complete and non-duplicate reports in the latest 90-day scoring window
        lastReportedAt:
          type: string
          format: date-time
          nullable: true
          description: the newest Counted report's time, ignoring the 90-day window
        freshnessKind:
          type: string
          enum: [ok, aging, stale]
          description: "under 30 days / 30-90 days / over 90 days or never reported"
        habitat: { type: string, example: "Intertidal mudflat & sandy shore" }
        habitatTag: { type: string, example: MUDFLAT }
        sensitivity: { type: string, example: Migratory feeding ground }
        primarySpeciesGlyph: { $ref: "#/components/schemas/SpeciesGlyph" }
        speciesNames:
          type: array
          items: { type: string }
          description: |
            Names of this beach's biodiversity cards, in sort_order. The map's biodiversity
            layer renders them directly; without it the layer carries habitat only and names
            no species. Names only — full cards stay in BeachDetail.species.
        coverImageUrl:
          type: string
          format: uri
          nullable: true
          description: null when there is no photo — the app falls back to the scene gradient
        scene:
          type: string
          description: a CSS background used when there is no photo; already in the seed data

    Species:
      type: object
      required: [name, kind, scientificName, threatCategory, glyph, text, source]
      properties:
        name: { type: string, example: Green Sea Turtle }
        kind:
          type: string
          enum: [species, habitat, group]
          description: only kind=species can carry a scientific name or a threat category
        scientificName:
          type: string
          nullable: true
          example: Chelonia mydas
        threatCategory:
          type: string
          nullable: true
          description: IUCN category. null when it could not be sourced — do not guess
          example: Endangered
        glyph: { $ref: "#/components/schemas/SpeciesGlyph" }
        pictureUrl: { type: string, format: uri, nullable: true }
        text: { type: string }
        source: { $ref: "#/components/schemas/SpeciesSource" }
        likelihood:
          nullable: true
          description: |
            Epic 5's occurrence model. Omit it or send null and the card renders as pure
            reference content. It must NEVER be folded into the litter severity score; the app
            styles it separately in amber and never calls it a probability.
          allOf: [{ $ref: "#/components/schemas/SpeciesLikelihood" }]

    SpeciesSource:
      type: object
      required: [dataset, citation]
      description: |
        Provenance is part of the data, not a footnote. FishBase and OBIS are both CC BY-NC:
        the citation has to be displayed, and the source URL and access date preserved.
      properties:
        dataset:
          type: string
          enum: [FishBase, OBIS, other, pending]
          description: on 'pending' the app prints an amber SOURCE PENDING badge
        citation: { type: string }
        url: { type: string, format: uri, nullable: true }
        accessedAt: { type: string, format: date, nullable: true }

    SpeciesLikelihood:
      type: object
      required: [state, basis]
      description: |
        Epic 5's occurrence model output. NOT a probability — the model uses only OBIS occurrence
        records, generated background points and coordinates, and its output is an uncalibrated
        RELATIVE score. Never render it with a percent sign.
        Covers four species: green sea turtle, clown anemonefish, Irrawaddy dolphin and sicklefin
        Moorish idol. Any other card has no score and will not get one this iteration.
      properties:
        state:
          type: string
          enum: [ready, pending, unavailable]
          description: |
            ready       connected, score is set
            pending     this static card has no sourced occurrence result
            unavailable this species is not one of the four
            pending and unavailable must stay apart on screen: one means not built yet,
            the other means it cannot be built.
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 38
          description: relative occurrence score, NOT a probability. Sent only when state=ready
        basis:
          type: string
          example: Coordinate model over OBIS occurrence records and background samples.
          description: what the number is based on. Shown verbatim on screen and never empty

    CompositionSlice:
      type: object
      required: [category, percentage]
      properties:
        category: { $ref: "#/components/schemas/LitterCategory" }
        percentage: { type: integer, minimum: 0, maximum: 100 }

    CompositionSource:
      type: object
      required: [reportId, createdAt, method]
      description: which report the composition came from. Required whenever composition is non-null
      properties:
        reportId: { type: string }
        createdAt: { type: string, format: date-time }
        method: { type: string, enum: [yolo, reported_quantity_estimate] }

    BeachDetail:
      allOf:
        - $ref: "#/components/schemas/BeachSummary"
        - type: object
          required: [composition, compositionSource, species, ecologicalNote]
          properties:
            composition:
              type: array
              nullable: true
              description: |
                Category percentages for that beach's newest Counted report, calculated by
                the backend for the model-ready UI. Rows add up to 100. Not an aggregate.
                Null when the beach has no Counted report at all.
              items: { $ref: "#/components/schemas/CompositionSlice" }
            compositionSource:
              nullable: true
              description: null exactly when composition is null
              allOf: [{ $ref: "#/components/schemas/CompositionSource" }]
            species:
              type: array
              maxItems: 5
              items: { $ref: "#/components/schemas/Species" }
            ecologicalNote: { type: string }

    ScoringMethod:
      type: object
      required: [categoryWeights, quantityWeights, bands, windowDays, minReports,
                 reportAggregation, beachAggregation, ruleVersion]
      properties:
        categoryWeights:
          type: array
          items:
            type: object
            required: [category, weight]
            properties:
              category: { $ref: "#/components/schemas/LitterCategory" }
              weight: { type: number, format: float }
        quantityWeights:
          type: array
          items:
            type: object
            required: [quantity, weight]
            properties:
              quantity: { $ref: "#/components/schemas/QuantityBand" }
              weight: { type: number, format: float }
        bands:
          type: array
          items:
            type: object
            required: [band, range, color]
            properties:
              band: { $ref: "#/components/schemas/SeverityBand" }
              range: { type: string, example: "1.5 – <2.5" }
              color: { type: string, example: "#D9A24B" }
        windowDays: { type: integer, example: 90 }
        minReports: { type: integer, example: 3 }
        reportAggregation:
          type: string
          enum: [max]
          description: maximum Category Score in the report
        beachAggregation:
          type: string
          enum: [median]
          description: median of eligible Report Scores in the latest 90-day window
        ruleVersion:
          type: string
          example: radar-sampah-scoring-v3

    UploadedPhoto:
      type: object
      required: [photoKey, previewUrl, metadataStripped]
      properties:
        photoKey:
          type: string
          description: |
            存储键，不是可访问地址。桶/目录在公开 Web 根目录之外且不可公开读。
            提交记录时把它原样放进 POST /reports 的 photoKey。
        previewUrl:
          type: string
          format: uri
          description: short-lived owner-scoped preview URL for the just-uploaded photo
        metadataStripped:
          type: boolean
          description: true only once the EXIF location data is really gone

    CreateReport:
      type: object
      required: [beachId, quantities, photoKey, locationSource]
      properties:
        beachId: { type: string, example: morib }
        quantities:
          type: object
          minProperties: 1
          description: |
            One band per category. Keys are the category strings verbatim, values are one of
            the four bands. At least one entry; a category that was not seen is simply absent —
            do not send null and do not send 0. The backend maps this onto the six qty_* columns
            and derives category / quantity from it.
          additionalProperties: { $ref: "#/components/schemas/QuantityBand" }
          example: { Plastic: Large, "Fishing gear": Medium }
        itemCounts:
          type: object
          description: Optional exact confirmed item counts for Iteration 2; the backend derives matching quantity bands.
          additionalProperties: { type: integer, minimum: 1, maximum: 100000 }
          example: { Plastic: 8, Other: 2 }
        eventId: { type: string, nullable: true, description: Optional event link for an in-event report }
        photoKey: { type: string, description: 上传接口返回的存储键 }
        locationSource:
          type: string
          enum: [gps, manual]
        coords:
          type: object
          nullable: true
          description: |
            Sent only when locationSource=gps. Stored on the report's own lat/lng columns,
            already rounded to 3 decimals (~110 m), and used only to match a beach.
            Never returned in any response — exclude both columns explicitly in the
            serialiser rather than relying on remembering; a SELECT * will carry them out.
          required: [lat, lng]
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }

    LitterReport:
      type: object
      required: [id, beachId, beachName, quantities, category, quantity, categoryScores,
                 reportScore, createdAt, status]
      properties:
        id: { type: string }
        beachId: { type: string }
        beachName: { type: string }
        quantities:
          type: object
          minProperties: 1
          description: |
            Which categories this report actually recorded. The full map must be returned:
            the correction flow reads it back into the form and PATCHes the whole set, so
            sending only the derived pair below would clear every other category.
          additionalProperties: { $ref: "#/components/schemas/QuantityBand" }
        itemCounts:
          type: object
          additionalProperties: { type: integer, minimum: 1, maximum: 100000 }
        remainingItemCounts:
          type: object
          additionalProperties: { type: integer, minimum: 1, maximum: 100000 }
        eventId: { type: string, nullable: true }
        category:
          description: derived — the category with the maximum category score (weight × quantity weight)
          allOf: [{ $ref: "#/components/schemas/LitterCategory" }]
        quantity:
          description: derived — that category's band
          allOf: [{ $ref: "#/components/schemas/QuantityBand" }]
        categoryScores:
          type: object
          description: Category Score for each submitted category (category weight × quantity weight)
          additionalProperties: { type: number, format: float }
        reportScore:
          type: number
          format: float
          description: maximum Category Score in this report
        createdAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ReportStatus" }
        statusNote:
          type: string
          nullable: true
          description: why it was excluded, a full English sentence shown verbatim; absent for Counted
        photoUrl:
          type: string
          format: uri
          nullable: true
          description: |
            短时效签名地址（≈15 分钟），按 photo_key 现签。
            只有记录本人才会拿到；不是本人就不返回这个字段。
            桶本身不可公开读 —— 见 API.md §5。

    ReportCounts:
      type: object
      required: [counted, duplicate, incomplete]
      properties:
        counted: { type: integer }
        duplicate: { type: integer }
        incomplete: { type: integer }

    CleanupTarget:
      type: object
      required: [reportId, beachId, beachName, reportedAt, remaining, remainingTotal]
      properties:
        reportId: { type: string }
        beachId: { type: string }
        beachName: { type: string }
        reportedAt: { type: string, format: date-time }
        itemCounts: { type: object, additionalProperties: { type: integer } }
        remaining: { type: object, additionalProperties: { type: integer, minimum: 1 } }
        remainingTotal: { type: integer, minimum: 1 }

    CleanupAction:
      type: object
      required: [id, participantId, targetReportId, eventId, beachId, beachName, createdAt, rows, score, handling, note, status]
      properties:
        id: { type: string }
        participantId: { type: string }
        targetReportId: { type: string }
        eventId: { type: string, nullable: true }
        beachId: { type: string }
        beachName: { type: string }
        createdAt: { type: string, format: date-time }
        rows:
          type: array
          items:
            type: object
            required: [category, removed, before, after]
            properties:
              category: { $ref: "#/components/schemas/LitterCategory" }
              removed: { type: integer, minimum: 1 }
              before: { type: integer, minimum: 1 }
              after: { type: integer, minimum: 0 }
        score: { type: integer, minimum: 1, description: Total items removed, not points }
        handling: { type: string, enum: [Collected for disposal, Recycled / handled, Not recorded] }
        note: { type: string }
        status: { type: string }

    CleanupEvent:
      type: object
      required: [id, beachId, beachName, area, date, startsAt, endsAt, status, source, participantCount, joinedBy, checkIns, attendanceBy, cleanupIds]
      properties:
        id: { type: string }
        beachId: { type: string }
        beachName: { type: string }
        area: { type: string }
        date: { type: string, format: date }
        startsAt: { type: string, example: "09:00" }
        endsAt: { type: string, example: "12:00" }
        status: { type: string, enum: [Open, Closed] }
        source: { type: string, enum: [weekly, admin] }
        participantCount: { type: integer, minimum: 0 }
        joinedBy: { type: array, items: { type: string } }
        checkIns: { type: object, additionalProperties: { type: string, enum: [idle, within_area] } }
        attendanceBy: { type: array, items: { type: string } }
        cleanupIds: { type: array, items: { type: string } }
